[project]
name = "switchmath"
version = "1.0.0"
description = "SwitchMath – Learn multiplication tables and earn Nintendo Switch playtime rewards"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["nintendo-switch", "parental-controls", "gamification", "math", "times-tables", "spaced-repetition", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pynintendoauth>=1.0.3",
    "pynintendoparental>=2.6.2",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
